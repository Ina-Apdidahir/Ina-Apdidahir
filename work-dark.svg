<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" font-family="ui-monospace,&#39;SFMono-Regular&#39;,&#39;SF Mono&#39;,&#39;Cascadia Code&#39;,&#39;Roboto Mono&#39;,Menlo,Consolas,&#39;Liberation Mono&#39;,monospace"><rect x="1" y="1" width="878" height="208" rx="14" fill="#faf6ee" stroke="#e6dfd0"></rect><rect x="14" y="48" width="78" height="36" rx="8" fill="#ffffff" stroke="#dcd4c3"></rect><text x="53" y="70" text-anchor="middle" font-size="12" fill="#3a382f">Clients</text><text x="115" y="71" text-anchor="middle" font-size="14" fill="#b7ad97">▶</text><rect x="138" y="48" width="104" height="36" rx="8" fill="#ffffff" stroke="#dcd4c3"></rect><text x="190" y="70" text-anchor="middle" font-size="12" fill="#3a382f">Edge / CDN</text><text x="265" y="71" text-anchor="middle" font-size="14" fill="#b7ad97">▶</text><rect x="288" y="48" width="126" height="36" rx="8" fill="#ffffff" stroke="#dcd4c3"></rect><text x="351" y="70" text-anchor="middle" font-size="12" fill="#3a382f">Node / Express</text><text x="437" y="71" text-anchor="middle" font-size="14" fill="#b7ad97">▶</text><rect x="460" y="17" width="110" height="28" rx="7" fill="#e7f2ea" stroke="#c9e0cf"></rect><text x="515" y="35" text-anchor="middle" font-size="11.5" fill="#1f8a4c">Auth svc</text><rect x="460" y="52" width="110" height="28" rx="7" fill="#e7f2ea" stroke="#c9e0cf"></rect><text x="515" y="70" text-anchor="middle" font-size="11.5" fill="#1f8a4c">Catalog svc</text><rect x="460" y="87" width="110" height="28" rx="7" fill="#e7f2ea" stroke="#c9e0cf"></rect><text x="515" y="105" text-anchor="middle" font-size="11.5" fill="#1f8a4c">Payments svc</text><text x="593" y="71" text-anchor="middle" font-size="14" fill="#b7ad97">▶</text><rect x="616" y="48" width="106" height="36" rx="8" fill="#ffffff" stroke="#dcd4c3"></rect><text x="669" y="70" text-anchor="middle" font-size="12" fill="#3a382f">Jobs / Queue</text><text x="745" y="71" text-anchor="middle" font-size="14" fill="#b7ad97">▶</text><rect x="768" y="17" width="98" height="28" rx="7" fill="#ffffff" stroke="#dcd4c3"></rect><text x="817" y="35" text-anchor="middle" font-size="11.5" fill="#2f6fd0">Postgres</text><rect x="768" y="52" width="98" height="28" rx="7" fill="#ffffff" stroke="#dcd4c3"></rect><text x="817" y="70" text-anchor="middle" font-size="11.5" fill="#1f8a4c">MongoDB</text><rect x="768" y="87" width="98" height="28" rx="7" fill="#ffffff" stroke="#dcd4c3"></rect><text x="817" y="105" text-anchor="middle" font-size="11.5" fill="#b06f1c">MySQL</text><text x="26" y="146" font-size="12"><tspan fill="#b3ad9d">// </tspan><tspan fill="#1f8a4c">find the seams</tspan><tspan fill="#8c8677"> — boundaries follow how the business changes, not the org chart.</tspan></text><text x="26" y="168" font-size="12"><tspan fill="#b3ad9d">// </tspan><tspan fill="#1f8a4c">make state explicit</tspan><tspan fill="#8c8677"> — events over hidden mutations. If you can replay it, you can reason about it.</tspan></text><text x="26" y="190" font-size="12"><tspan fill="#b3ad9d">// </tspan><tspan fill="#1f8a4c">optimize for the next person</tspan><tspan fill="#8c8677"> — the best architecture is the one a new hire understands by Friday.</tspan></text></svg>