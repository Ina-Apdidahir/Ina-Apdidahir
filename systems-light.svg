<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" font-family="ui-monospace,&#39;SFMono-Regular&#39;,&#39;SF Mono&#39;,&#39;Cascadia Code&#39;,&#39;Roboto Mono&#39;,Menlo,Consolas,&#39;Liberation Mono&#39;,monospace"><rect x="1" y="1" width="878" height="208" rx="14" fill="#0b0f18" stroke="#1f2630"></rect><rect x="14" y="48" width="78" height="36" rx="8" fill="#0d1117" stroke="#2a3441"></rect><text x="53" y="70" text-anchor="middle" font-size="12" fill="#c9d1d9">Clients</text><text x="115" y="71" text-anchor="middle" font-size="14" fill="#39415a">▶</text><rect x="138" y="48" width="104" height="36" rx="8" fill="#0d1117" stroke="#2a3441"></rect><text x="190" y="70" text-anchor="middle" font-size="12" fill="#c9d1d9">Edge / CDN</text><text x="265" y="71" text-anchor="middle" font-size="14" fill="#39415a">▶</text><rect x="288" y="48" width="126" height="36" rx="8" fill="#0d1117" stroke="#2a3441"></rect><text x="351" y="70" text-anchor="middle" font-size="12" fill="#c9d1d9">Node / Express</text><text x="437" y="71" text-anchor="middle" font-size="14" fill="#39415a">▶</text><rect x="460" y="17" width="110" height="28" rx="7" fill="#0e1c14" stroke="#2f5240"></rect><text x="515" y="35" text-anchor="middle" font-size="11.5" fill="#7ee787">Auth svc</text><rect x="460" y="52" width="110" height="28" rx="7" fill="#0e1c14" stroke="#2f5240"></rect><text x="515" y="70" text-anchor="middle" font-size="11.5" fill="#7ee787">Catalog svc</text><rect x="460" y="87" width="110" height="28" rx="7" fill="#0e1c14" stroke="#2f5240"></rect><text x="515" y="105" text-anchor="middle" font-size="11.5" fill="#7ee787">Payments svc</text><text x="593" y="71" text-anchor="middle" font-size="14" fill="#39415a">▶</text><rect x="616" y="48" width="106" height="36" rx="8" fill="#0d1117" stroke="#2a3441"></rect><text x="669" y="70" text-anchor="middle" font-size="12" fill="#c9d1d9">Jobs / Queue</text><text x="745" y="71" text-anchor="middle" font-size="14" fill="#39415a">▶</text><rect x="768" y="17" width="98" height="28" rx="7" fill="#0d1117" stroke="#2a3441"></rect><text x="817" y="35" text-anchor="middle" font-size="11.5" fill="#79c0ff">Postgres</text><rect x="768" y="52" width="98" height="28" rx="7" fill="#0d1117" stroke="#2a3441"></rect><text x="817" y="70" text-anchor="middle" font-size="11.5" fill="#7ee787">MongoDB</text><rect x="768" y="87" width="98" height="28" rx="7" fill="#0d1117" stroke="#2a3441"></rect><text x="817" y="105" text-anchor="middle" font-size="11.5" fill="#f0a868">MySQL</text><text x="26" y="146" font-size="12"><tspan fill="#484f58">// </tspan><tspan fill="#7ee787">find the seams</tspan><tspan fill="#6e7681"> — boundaries follow how the business changes, not the org chart.</tspan></text><text x="26" y="168" font-size="12"><tspan fill="#484f58">// </tspan><tspan fill="#7ee787">make state explicit</tspan><tspan fill="#6e7681"> — events over hidden mutations. If you can replay it, you can reason about it.</tspan></text><text x="26" y="190" font-size="12"><tspan fill="#484f58">// </tspan><tspan fill="#7ee787">optimize for the next person</tspan><tspan fill="#6e7681"> — the best architecture is the one a new hire understands by Friday.</tspan></text></svg>